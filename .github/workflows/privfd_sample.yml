name: PrivFD-IDS sampled benchmark experiment

on:
  push:
    branches: [main]
    paths:
      - "run_privfd_sample.py"
      - ".github/workflows/privfd_sample.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout experiment code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas scikit-learn matplotlib scipy opacus requests
      - name: Run reproducible sampled-data grid
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -o pipefail
          mkdir -p privfd_outputs
          python -u run_privfd_sample.py 2>&1 | tee privfd_outputs/runner.log
      - name: Upload metrics, configuration, and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privfd-ids-experiment-results
          path: privfd_outputs/
          if-no-files-found: warn
          retention-days: 14
